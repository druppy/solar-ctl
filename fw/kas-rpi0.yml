# solar-ctl firmware target: Raspberry Pi Zero W.
#
# This is the file you build:
#   kas build fw/kas-rpi0.yml
#
# For the plain Zero / Zero 2 W, change the machine to
# raspberrypi0 / raspberrypi0-2w-64.
header:
  version: 17

distro: solar-ctl
machine: raspberrypi0-wifi

target:
  - solar-ctl-image

# WiFi credentials for the solar-wifi recipe (wpa_supplicant-wlan0.conf +
# units). Declaring them here makes kas export them to bitbake (via
# BB_ENV_PASSTHROUGH_ADDITIONS) AND lets the OS environment override the
# placeholders below - that is how the real values get in without ever
# touching a committed file: the Zed "Build FW" task (.zed/tasks.json,
# gitignored) sets them as env vars. CI instead injects them from Actions
# secrets via the generated .kas-wifi-ci.yml fragment, whose local.conf
# assignments override the environment. Arbitrary UNdeclared env vars are
# ignored by kas - only the three names below are passed through.
# The recipe's sed uses '|' as delimiter: values must not contain '|'.
# Generate a hex PSK from a passphrase with:
#   wpa_passphrase "SSID" 'pass' | sed -n 's/.*psk=//p'
env:
  SOLAR_WIFI_SSID: CHANGEME
  SOLAR_WIFI_PSK: CHANGEME
  # WiFi regulatory domain (allowed channels), ISO 3166-1 alpha-2.
  SOLAR_WIFI_COUNTRY: GB

repos:
  # Pull in the pinned repo definitions (oe-core, bitbake,
  # meta-raspberrypi, this repo)...
  solar-ctl:
    # No url: kas uses this local clone directly (the layer we are
    # developing), so uncommitted changes are picked up and our git
    # remote config is never touched. Reproducibility comes from the
    # pinned upstream layers.
    path: .
    layers:
      fw:
  oe-core:
    url: https://github.com/openembedded/openembedded-core
    # Pre-production: follow release branch tips. kas warns "branch without
    # commit is unsafe" - accepted noise. To freeze an exact state (e.g.
    # before a release tag), run `kas lock fw/kas-rpi0.yml`: it writes
    # fw/kas-rpi0.lock.yml which kas then honours automatically on every
    # build until the lock file is updated or removed. TODO: lock before
    # the first tagged release.
    branch: wrynose
    path: layers/openembedded-core
    layers:
      meta:
  bitbake:
    url: https://github.com/openembedded/bitbake
    # bitbake has no per-release branch names; wrynose requires 2.18
    # (enforced by oe-core's sanity checker).
    branch: "2.18"
    path: layers/bitbake
    layers: {}
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    branch: wrynose
    path: layers/meta-raspberrypi
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: wrynose
    path: layers/meta-openembedded
    layers:
      # only what we need from meta-OE (mbpoll/libmodbus for bus bring-up)
      meta-oe:

local_conf_header:
  solar-ctl: |
    # --- Raspberry Pi Zero conveniences ------------------------------------
    # Console on the mini-UART so we can log in without a monitor
    # (writes enable_uart=1 into config.txt).
    ENABLE_UART = "1"
    # Zero's USB port is wired as peripheral-only; enable the DWC2 gadget
    # driver if you ever want g_ether (usb0) access from a laptop.
    # ENABLE_DWC2_PERIPHERAL = "1"

    # --- solar-ctl peripherals -------------------------------------------
    # No display stack: drops the vc4graphics machine feature (and with it
    # meta-raspberrypi's vc4graphics.cfg, which would force DRM_VC4=y on
    # top of our slimming fragment in linux-raspberrypi).
    DISABLE_VC4GRAPHICS = "1"
    # Ship our device-tree overlays: built by the kernel recipe (files +
    # bbappend in recipes-kernel/linux) and copied to the boot partition's
    # overlays/ dir by IMAGE_BOOT_FILES. Must live here (not the kernel
    # bbappend) so the image recipe sees them too.
    RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/nv3007.dtbo overlays/solar-rs485.dtbo"
    # config.txt lines appended by rpi-config: the NV3007 TFT is enabled
    # by default (harmless when unconnected). solar-rs485 moves the PL011
    # onto the console's GPIO14/15 and kills the mini-UART console, so it
    # stays commented out until the transceiver is actually wired - see
    # fw/README.md for the wiring and the SERIAL_CONSOLES caveat.
    RPI_EXTRA_CONFIG = "\
        dtoverlay=nv3007 \n \
        #dtoverlay=solar-rs485 \n \
    "

    # --- Packaging / build hygiene ------------------------------------------
    PACKAGE_CLASSES = "package_rpm"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    # Keep build tmp/work from eating the disk during large rebuilds.
    # NOTE: do NOT use rm_work_and_downloads here: it moves DL_DIR into the
    # per-recipe workdir and deletes it with do_rm_work, which breaks
    # recipes built for both target and native from one tarball (git,
    # ...): git-native's do_unpack then finds the target's already-deleted
    # download and dies (and do_fetch is not re-run). Plain rm_work keeps a
    # shared build/downloads, which is also what the CI cache stores.
    INHERIT += "rm_work"

    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K"

  licenses: |
    # linux-firmware-rpidistro requires accepting the Synaptics killswitch
    # firmware license (see meta-raspberrypi docs/ipcompliance.md).
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
