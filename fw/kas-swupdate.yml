# SWUpdate compile gate: everything kas-rpi0.yml has, plus the
# meta-swupdate layer, building the `swupdate` recipe ONLY (no image).
#
#   kas build fw/kas-swupdate.yml
#
# Why a separate config instead of a line in kas-rpi0.yml: the production
# image build must stay provably untouched while we answer the real open
# question of fw/docs/swupdate-ota.md §10.1 - does SWUpdate compile against
# our musl/wrynose distro? Upstream ships no musl patches for it. Nothing
# here installs SWUpdate into an image (no IMAGE_INSTALL change).
#
# Kas merge semantics (read before editing, verified against kas source):
#  * configs are merged key-by-key: `repos:` and `local_conf_header:` merge,
#    but scalar AND list values are REPLACED (includehandler._internal_dict_merge)
#    => the `target` below replaces `solar-ctl-image`, it does not add to it.
#  * string entries under `header.includes` resolve against the REPO ROOT
#    (a file-relative path also works, but kas warns about it).
header:
  version: 17
  includes:
    - fw/kas-rpi0.yml

target:
  - swupdate

repos:
  meta-swupdate:
    # GitHub mirror (git.yoctoproject.org is unreachable from here). The
    # layer sits at the repo root (conf/layer.conf), hence no `layers:` key
    # - same shape as the meta-raspberrypi entry.
    url: https://github.com/sbabic/meta-swupdate
    branch: wrynose
    path: layers/meta-swupdate
