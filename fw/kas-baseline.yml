# Baseline repo pinning for the solar-ctl firmware build.
#
# NOTE: kas >= 5 dropped the ``repo: <config-file>`` string shorthand, so a
# fragment like this cannot be auto-included. Treat this file as the
# reference copy of the pinned repos; ``kas-rpi0.yml`` (the file you build)
# carries the same definitions.
#
# Deliberately avoids poky: standalone openembedded-core + a separate
# bitbake checkout, with our own distro config (fw/conf/distro/solar-ctl.conf)
# provided by the `fw` meta layer in this repo.
header:
  version: 17

machine: raspberrypi0-wifi
distro: solar-ctl

repos:
  solar-ctl:
    # No url: kas uses the local clone this config lives in; the fw layer
    # is developed here, so no fetch/checkout of it is performed.
    path: .
    layers:
      fw:

  oe-core:
    url: https://github.com/openembedded/openembedded-core
    branch: wrynose
    commit: 883075157987ca300af59185b903d6d1977234c3
    path: layers/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://github.com/openembedded/bitbake
    # bitbake has no per-release branch names; wrynose ships/requires 2.18.
    branch: "2.18"
    path: layers/bitbake
    # Not a layer; oe-core's buildenv expects it as a sibling directory.
    layers: {}

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    branch: wrynose
    commit: f62c67921474370829d24a4fa01ef88543f3906b
    path: layers/meta-raspberrypi
