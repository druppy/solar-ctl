# Persistent journald on /data (installed by solar-swu-agent).
# /var/log is a symlink to /data/log (solar-ctl-image.bb postprocess) and the
# preinit creates /data/log before PID 1, so the journal lands on ext4:
# off the 512 MB RAM tmpfs AND alive across reboots (bench 2026-09-28: the
# volatile journal lost every auto-rebooting update's own SUCCESS log).
# SystemMaxUse caps the TOTAL journal footprint on the SD card (rotation
# shrinks history, never grows the files) - lower it (e.g. 8M) for long-term
# production deployments where card wear matters more than history depth.
[Journal]
Storage=persistent
SystemMaxUse=32M
SystemMaxFileSize=8M
