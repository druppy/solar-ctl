# solar-ctl SWUpdate kconfig fragment, merged over meta-swupdate's
# recipes-support/swupdate/swupdate/defconfig.
#
# How this file takes effect (verified against meta-swupdate wrynose + cml1):
# swupdate.inc inherits cml1; do_configure concatenates
#   <CONFIG_EXTRA_CFLAGS/LDFLAGS> + ${UNPACKDIR}/defconfig + every *.cfg in SRC_URI
# then runs merge_config.sh -m (last file wins) and olddefconfig. So a .cfg in
# SRC_URI is this recipe's PACKAGECONFIG equivalent.
#
# TWO TRAPS, both verified against upstream sources:
#  * These are kconfig symbols, not bitbake vars. HAVE_<lib> symbols are probed
#    from the sysroot by SWUpdate's own Makefile, and olddefconfig SILENTLY
#    DROPS any symbol whose "depends on HAVE_<lib>" is unsatisfied. A fragment
#    being accepted therefore proves nothing: the 'swupdate' CI job in
#    .github/workflows/firmware.yml greps the merged .config to show what stuck.
#  * CURL and CURL_SSL are hidden symbols (no prompt); they are only reachable
#    through SURICATTA / DOWNLOAD* (CHANNEL_CURL*). Do not set them here.
#
# Note "# CONFIG_X is not set" is load-bearing syntax: swupdate.inc's DEPENDS
# regex is ^(?:# )?(CONFIG_[A-Za-z0-9_]*)[= ], so this form removes a base
# CONFIG_X=y *and* the DEPENDS it dragged in.

# --- bootloader: none -------------------------------------------------------
# No U-Boot here: start.elf loads the kernel straight off the FAT boot
# partition, and A/B switching is done by the RPi firmware (tryboot) from a
# SWUpdate script handler - see fw/docs/swupdate-ota.md §5 and §6.3. UBOOT
# depends on HAVE_LIBUBOOTENV and is only there to poke u-boot env vars.
# CONFIG_UBOOT is not set
# BOOTLOADER_NONE is already `default y` and the "Default Bootloader
# Interface" choice resolves to it once UBOOT is off; spelled out anyway
# because "which bootloader backend" is the crux of this design.
CONFIG_BOOTLOADER_NONE=y

# --- no flash ---------------------------------------------------------------
# SD card only. The mtd/cfi handlers are dead weight, and turning them off is
# what drops the mtd-utils DEPENDS.
# CONFIG_MTD is not set
# CONFIG_CFI is not set

# --- signing: a gate, not a nice-to-have ------------------------------------
# Stage 1 ships .swu files through the web UI (base defconfig already has
# WEBSERVER/MONGOOSE/MONGOOSESSL on - note MONGOOSESSL is web *TLS*, not image
# signing). This repo is public, so an unsigned OTA endpoint is remote root:
# see fw/docs/swupdate-ota.md §6.4. SIGNED_IMAGES selects HASH_VERIFY; both
# depend on an SSL implementation (SSL_IMPL_OPENSSL=y in the base defconfig).
CONFIG_HASH_VERIFY=y
CONFIG_SIGNED_IMAGES=y

# --- init system ------------------------------------------------------------
# Our distro is INIT_MANAGER=systemd; the recipe ships swupdate.service +
# swupdate.socket (enabled by mere installation) and needs libsystemd.
CONFIG_SYSTEMD=y

# --- deliberately left off, with the reason ---------------------------------
# SURICATTA (+ CHANNEL_CURL_SSL -> CURL/CURL_SSL): that IS the Hawkbit client.
#   Stage 3 of the design; enabling it now would also add a curl DEPENDS.
# DISKPART: needs util-linux + e2fsprogs; we do not create partitions on the
#   target, the layout is baked by the kickstart.
# ARCHIVE / RDIFFHANDLER / REMOTE_HANDLER (zeromq) / UCFWHANDLER (libgpiod):
#   not needed to write a squashfs image to a partition.
# And left ON by the base defconfig because the slot-switch scripts need them:
#   LUA, LUASCRIPTHANDLER, SHELLSCRIPTHANDLER, SCRIPTS, RAW (writes device=
#   literally), GUNZIP, LIBCONFIG, HW_COMPATIBILITY (=> /etc/hwrevision is
#   mandatory once this ships in an image).
