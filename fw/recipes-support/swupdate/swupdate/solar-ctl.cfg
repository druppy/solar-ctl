# solar-ctl SWUpdate kconfig fragment, merged over meta-swupdate's
# recipes-support/swupdate/swupdate/defconfig.
#
# How this file takes effect (verified against meta-swupdate wrynose + cml1):
# swupdate.inc inherits cml1; do_configure concatenates
#   <CONFIG_EXTRA_CFLAGS/LDFLAGS> + ${UNPACKDIR}/defconfig + every *.cfg in SRC_URI
# then runs merge_config.sh -m (last file wins) and olddefconfig. So a .cfg in
# SRC_URI is this recipe's PACKAGECONFIG equivalent.
#
# TWO TRAPS, both verified against upstream sources:
#  * These are kconfig symbols, not bitbake vars. HAVE_<lib> symbols are probed
#    from the sysroot by SWUpdate's own Makefile, and olddefconfig SILENTLY
#    DROPS any symbol whose "depends on HAVE_<lib>" is unsatisfied. A fragment
#    being accepted therefore proves nothing: the firmware CI job greps the
#    merged .config snapshot (see the bbappend) to show what stuck.
#  * CURL and CURL_SSL are hidden symbols (no prompt); they are only reachable
#    through SURICATTA / DOWNLOAD* (CHANNEL_CURL*). Do not set them here.
#
# Note "# CONFIG_X is not set" is load-bearing syntax: swupdate.inc's DEPENDS
# regex is ^(?:# )?(CONFIG_[A-Za-z0-9_]*)[= ], so this form removes a base
# CONFIG_X=y *and* the DEPENDS it dragged in.

# --- bootloader: U-Boot env on p1 --------------------------------------------
# The sw-description `bootenv` section (slot=a|b) is written by SWUpdate
# itself, after all images installed OK (core/installer.c flushes it).
# UBOOT depends on HAVE_LIBUBOOTENV: met (libubootenv is an unconditional
# DEPENDS; libubootenv0 + u-boot-env ship in the image). The backend talks to
# the SAME target as fw_setenv via /etc/fw_env.config, and dlopens the .so at
# runtime. TRAP: the "Default Bootloader Interface" choice has NO default
# statement and UBOOT precedes NONE in it, so UBOOT=y silently flips the
# default - pin the choice explicitly. NONE stays compiled as an opt-in
# fallback but is not the default (it persists nothing, RAM-only dict).
CONFIG_UBOOT=y
CONFIG_BOOTLOADER_DEFAULT_UBOOT=y
# TRAP (bench 2026-09-28): the bootenv/uboot *image handlers* that the parser
# resolves are a SEPARATE switch from the backend above
# (handlers/boot_handler.c, obj-$(CONFIG_BOOTLOADERHANDLER), default n).
# With only the backend built, every install dies in the parser:
# "bootloader support absent but sw-description has bootloader section!".
# CI asserts this symbol.
CONFIG_BOOTLOADERHANDLER=y
# Edge note: if the on-disk env cannot be opened, uboot.c loads
# UBOOT_DEFAULTENV (/etc/u-boot-initial-env) and a later env_store() would
# overwrite uboot.env with it. That file is deliberately NOT in our image, so
# this path errors out ("Cannot read default environment from file") instead
# of silently rewriting the board env. (UBOOT_DEFAULTENV is a string symbol
# with prompt, default /etc/u-boot-initial-env - left at its default on
# purpose.)

# --- no flash ---------------------------------------------------------------
# SD card only. The mtd/cfi handlers are dead weight, and turning them off is
# what drops the mtd-utils DEPENDS.
# CONFIG_MTD is not set
# CONFIG_CFI is not set

# --- signing: a gate, not a nice-to-have ------------------------------------
# SIGNED_IMAGES selects HASH_VERIFY; both depend on SSL_IMPL_OPENSSL (=y in
# the base defconfig). The signature algorithm is fixed: SIGALG_RAWRSA is
# `default y` under SIGNED_IMAGES = RSA PKCS#1 v1.5 over SHA-256, verified
# device-side against -k pub.pem (swupdate has NO ed25519: the RSA path
# streams EVP_DigestVerifyUpdate/Final). CI asserts SIGALG_RAWRSA=y.
CONFIG_HASH_VERIFY=y
CONFIG_SIGNED_IMAGES=y

# --- init system ------------------------------------------------------------
# Our distro is INIT_MANAGER=systemd. NOTE: mere installation enables
# swupdate.service/.socket - solar-ctl-image.bb deletes them (on-demand
# CLI flow via /usr/bin/solar-update, no daemon).
CONFIG_SYSTEMD=y

# --- download channel: pull the .swu from a URL ------------------------------
# swupdate -d "-u https://host/fw.swu" -e stable,<set> -k pub.pem.
# DOWNLOAD selects CHANNEL_CURL (-> hidden CURL), DOWNLOAD_SSL selects
# CHANNEL_CURL_SSL (-> hidden CURL_SSL) for https. This is the only thing in
# this fragment that pulls a curl (+TLS) DEPENDS/RDEPENDS - accepted cost of
# fetch-by-URL. Signing still verifies the downloaded stream.
CONFIG_DOWNLOAD=y
CONFIG_DOWNLOAD_SSL=y

# --- everything not needed to write raw images: OFF (size on 512 MB) --------
# The .swu carries pure data only (raw handler + bootenv section): the old
# rationale for keeping LUA/SCRIPTS on ("slot-switch scripts run inside
# swupdate") is dead - the switch is a `bootenv` entry in the signed
# sw-description, flushed by SWUpdate itself on success. Dropping LUA also
# drops the liblua DEPENDS.
# CONFIG_SCRIPTS is not set
# CONFIG_LUA is not set
# CONFIG_LUASCRIPTHANDLER is not set
# CONFIG_SHELLSCRIPTHANDLER is not set

# No web UI: WEBSERVER is the mongoose UI (MONGOOSESSL there is web *TLS*,
# not image signing). Keeping the attack surface at zero: no listener exists
# at all; the device PULLS updates (DOWNLOAD above), nothing connects in.
# CONFIG_WEBSERVER is not set
# CONFIG_MONGOOSE is not set

# --- deliberately left off, with the reason ---------------------------------
# SURICATTA (+ CURL/CURL_SSL): that IS the Hawkbit client - stage 3 of the
#   design; the curl DEPENDS it adds is now already paid by DOWNLOAD above,
#   but the management-protocol client itself is still not wanted.
# DISKPART: needs util-linux + e2fsprogs; we do not create partitions on the
#   target, the layout is baked by the kickstart.
# ARCHIVE / RDIFFHANDLER / REMOTE_HANDLER (zeromq) / UCFWHANDLER (libgpiod):
#   not needed to write a squashfs image to a partition.
# Left ON by the base defconfig because we DO need them: RAW (block devices
#   only - it open()s device= without O_CREAT, so the /data kernel file is
#   written by RAWFILE instead, see sw-description), GUNZIP, LIBCONFIG,
#   HW_COMPATIBILITY (=> /etc/hwrevision is mandatory, and must read
#   "<board> <rev>" - two tokens - shipped by solar-swu-agent),
#   HASH_VERIFY/SIGNED_IMAGES above.
