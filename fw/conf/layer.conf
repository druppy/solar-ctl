#@TYPE: Layer
#@NAME: solar-ctl firmware layer
#@DESCRIPTION: Distro config, firmware image and (soon) the inv_ctl
#              inverter-controller recipe for the solar-ctl RPi Zero FW.
#
# This is intentionally NOT a full BSP layer: it only carries our own
# distro conf, image recipe and application recipes. The BSP comes from
# meta-raspberrypi, the core from oe-core.

BBPATH .= ":${LAYERDIR}"

# conf/distro/solar-ctl.conf is found through BBPATH, so no BBFILES needed
# yet, but keep recipes visible for when inv_ctl lands.
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "solar-ctl"
BBFILE_PATTERN_solar-ctl = "^${LAYERDIR}/"
BBFILE_PRIORITY_solar-ctl = "6"

LAYERSERIES_COMPAT_solar-ctl = "wrynose"
