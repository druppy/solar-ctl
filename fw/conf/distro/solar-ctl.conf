# Solar-ctl firmware distro config ("nodistro" = plain OE-core, no poky).
#
# Keep this file small: only tune/libc/init/distro-feature knobs belong here.
# Image contents live in recipes-core/images/solar-ctl-image.bb.
DISTRO_NAME = "solar-ctl firmware (nodistro)"
DISTRO_VERSION = "0.1"

# --- Target C library: musl instead of glibc -------------------------------
TCLIBC = "musl"

# --- Init system: systemd + busybox ----------------------------------------
# systemd is already OE-core's default INIT_MANAGER; set it explicitly so a
# future default change can't silently swap it under us. Busybox is already
# the default busybox provider in OE-core and is pulled by packagegroup-
# core-boot; we keep the image lean by simply never adding the 'full cmdline'
# packagegroups (util-linux/shadow etc.), so no VIRTUAL-RUNTIME overrides
# are needed.
INIT_MANAGER = "systemd"

# Keep the distro features lean: drop the big default list (x11, wayland,
# opengl, vulkan, pulseaudio, bluetooth, alsa, ...) and opt back in only
# what the headless inverter controller needs.
DISTRO_FEATURES_DEFAULTS = "acl ext2 ipv4 ipv6 usbhost vfat xattr zeroconf wifi seccomp nfs"

# NOTE: DISABLE_VC4GRAPHICS (drops the vc4graphics machine feature from
# meta-raspberrypi) is a machine/BSP knob and lives in the kas
# local_conf_header of fw/kas-rpi0.yml — set it in exactly one place.
