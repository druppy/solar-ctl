# solar-ctl kernel slimming for the Zero W headless controller.
#
# bcmrpi_defconfig carries the full desktop-Pi display/media/sound
# stack (VC4 KMS, DSI panels, camera sensors, fbtft, ~60 sound cards).
# We need none of it; the only display hardware on solar-ctl is the
# NV3007 SPI TFT (panel-mipi-dbi, kept below). This fragment is a
# kernel-yocto config fragment (SRC_URI file://*.cfg in the bbappend),
# applied after KBUILD_DEFCONFIG with KCONFIG_MODE=--alldefconfig, so
# "is not set" lines genuinely override the defconfig "=m"/"=y".
#
# NOTE: also set DISABLE_VC4GRAPHICS = "1" (kas local_conf_header) -
# otherwise meta-raspberrypi's vc4graphics.cfg machine-feature fragment
# re-enables DRM_VC4 on top of this.

# --- Graphics: keep DRM core + panel-mipi-dbi only ---------------------
# CONFIG_DRM_VC4 is not set
# CONFIG_DRM_VC4_HDMI_CEC is not set
# CONFIG_DRM_LOAD_EDID_FIRMWARE is not set
# CONFIG_DRM_UDL is not set
# CONFIG_DRM_GUD is not set
# CONFIG_DRM_SSD130X is not set
# CONFIG_DRM_SSD130X_I2C is not set
# CONFIG_DRM_SSD130X_SPI is not set
# CONFIG_DRM_PANEL_SIMPLE is not set
# CONFIG_DRM_PANEL_ILITEK_ILI9806E is not set
# CONFIG_DRM_PANEL_ILITEK_ILI9806E_SPI is not set
# CONFIG_DRM_PANEL_ILITEK_ILI9881C is not set
# CONFIG_DRM_PANEL_JDI_LT070ME05000 is not set
# CONFIG_DRM_PANEL_RASPBERRYPI_TOUCHSCREEN is not set
# CONFIG_DRM_PANEL_SITRONIX_ST7701 is not set
# CONFIG_DRM_PANEL_TPO_Y17P is not set
# CONFIG_DRM_PANEL_TDO_DSI_V1 is not set
# CONFIG_DRM_PANEL_WAVESHARE_TOUCHSCREEN is not set
# CONFIG_DRM_PANEL_WAVESHARE_TOUCHSCREEN_V2 is not set
# CONFIG_DRM_DISPLAY_CONNECTOR is not set
# CONFIG_DRM_SIMPLE_BRIDGE is not set
# CONFIG_DRM_TOSHIBA_TC358762 is not set
# all tinydrm panels (the 142x428 NV3007 needs panel-mipi-dbi; the
# ili9341 driver hardcodes 240x320 and is dead weight for us)
# CONFIG_TINYDRM_HX8357D is not set
# CONFIG_TINYDRM_ILI9225 is not set
# CONFIG_TINYDRM_ILI9341 is not set
# CONFIG_TINYDRM_ILI9486 is not set
# CONFIG_TINYDRM_MI0283QT is not set
# CONFIG_TINYDRM_REPAPER is not set

# --- Legacy VideoCore / misc framebuffers ------------------------------
# CONFIG_FB_BCM2708 is not set
# CONFIG_FB_SIMPLE is not set
# CONFIG_FB_SSD1307 is not set
# CONFIG_FB_RPISENSE is not set
# CONFIG_FB_TFT is not set
# CONFIG_STAGING_MEDIA is not set
# CONFIG_STAGING_MEDIA_DEPRECATED is not set

# --- Keep the NV3007 TFT path working -----------------------------------
# panel-mipi-dbi = generic SPI MIPI-DBI panel driver, mode comes from DT
# panel-timing, NV3007 init code from /lib/firmware/panel-mipi-dbi-spi.bin.
CONFIG_DRM_PANEL_MIPI_DBI=m
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_BACKLIGHT_GPIO=m

# --- Backlight drivers we don't have hardware for ------------------------
# CONFIG_BACKLIGHT_RPI is not set
# CONFIG_BACKLIGHT_LM3630A is not set
# CONFIG_BACKLIGHT_PWM is not set

# --- Camera / media / remote-control stack ------------------------------
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_MEDIA_CEC_RC is not set
# CONFIG_MEDIA_USB_SUPPORT is not set
# CONFIG_INPUT_TOUCHSCREEN is not set

# --- Sound (entire ALSA core + every Pi audio HAT) -----------------------
# CONFIG_SOUND is not set

# --- Root filesystem: squashfs must be BUILT-IN ---------------------------
# The A/B root slots are squashfs and we boot without an initramfs, so with
# =m (the bcmrpi_defconfig default) the kernel has no driver when it tries
# to mount root: VFS panic, "List of all bdev filesystems" without squashfs
# (seen on the bench 2026-09-25). overlay.ko stays =m on purpose - it is
# only needed from userspace after / is mounted, where request_module()
# can load it from /lib/modules inside the rootfs.
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
