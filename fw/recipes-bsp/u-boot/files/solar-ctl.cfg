# solar-ctl U-Boot kconfig fragment (cml1/u-boot-configure.inc merges every
# SRC_URI *.cfg via merge_config.sh -m over rpi_0_w_defconfig).
#
# boot.scr loads the per-slot kernel from ext4 /data (p4) instead of p1 FAT
# (doc swupdate-ota.md §5 per-slot kernel; user decision 2026-09-28: p1
# carries only the GPU firmware + U-Boot + fallback uImage). The rpi_0_w
# defconfig has no ext4 support, so both symbols are needed for `ext4load`.
# Runtime existence of ext4load is a bench item, see README A/B section.
CONFIG_CMD_EXT4=y
CONFIG_FS_EXT4=y

# --- U-Boot env off the p1 FAT partition (2026-10-05) ----------------------
# ARCH_BCM283X forces ENV_IS_IN_FAT=y via `default y` in env/Kconfig, so
# every env write rewrote FAT metadata on the one partition we treat as
# immutable. Switch to the raw-MMC backend with U-Boot's standard
# redundancy: two [crc][flags][data] copies in a hidden raw SD area that
# wic bakes at flash time (fw/classes/solar-ablayout.bbclass + the wks).
# A torn env write can no longer kill both copies, and FAT stays read-only
# for Linux forever.
#
# TRAP (hit 2026-10-05): NO env-backend symbols may live in THIS file.
# u-boot-configure.inc's uboot_configure() merges SRC_URI *.cfg and then
# runs cml1_do_configure = `yes '' | oe_runmake oldconfig`; enabling
# ENV_IS_IN_MMC/ENV_REDUNDANT here makes ENV_OFFSET (a `hex` symbol with
# NO default) prompt, and empty `yes` answers re-prompt forever: an
# infinite loop that wrote a 60 GB log.do_configure before being killed.
# All env symbols (backend switch included) are therefore generated from
# the solar-ablayout class constants and POST-merged in
# u-boot_%.bbappend (do_configure:prepend + :append, olddefconfig).
