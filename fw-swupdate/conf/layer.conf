#@TYPE: Layer
#@NAME: solar-ctl SWUpdate gate layer
#@DESCRIPTION: Recipes that only make sense once meta-swupdate is in
#              bblayers.conf. Kept out of the `fw` layer on purpose: bitbake
#              parses every *.bbappend in every active layer, and a bbappend
#              whose target recipe is not available is a hard error on
#              wrynose ("No recipes in default available for: ..."), which
#              would break the production image build that has no
#              meta-swupdate at all.
#
# Only fw/kas-swupdate.yml adds this layer (repos.solar-ctl.layers merges
# across kas configs, so including it appends rather than replaces). When
# SWUpdate graduates into the image, move recipes-support/swupdate back into
# fw/ and delete this layer.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "solar-ctl-swupdate"
BBFILE_PATTERN_solar-ctl-swupdate = "^${LAYERDIR}/"
BBFILE_PRIORITY_solar-ctl-swupdate = "6"

# Needs meta-swupdate for the recipe this layer only appends to. Declared the
# same way meta-swupdate declares its own dependency, so a missing
# meta-swupdate is reported by bitbake's layer-dependency check instead of by
# the dangling-append error this layer exists to avoid.
LAYERDEPENDS_solar-ctl-swupdate = "swupdate"

LAYERSERIES_COMPAT_solar-ctl-swupdate = "wrynose"
