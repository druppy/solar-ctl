name: firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  # Cancelling a push build on every new push means the 60+ min cold build
  # never survives long enough to run 'Save bitbake cache', so main never
  # warms up. Queue push builds; keep cancelling superseded PR builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_DIR: build/tmp/deploy/images/raspberrypi0-wifi

jobs:
  # Fast native unit tests (inv_ctl), independent of the firmware build.
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install host deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build

      # UI OFF: no glibmm/SDL2/LVGL needed - net.cpp is pure libc + syscalls.
      - name: Configure (tests only)
        run: cmake -S inv_ctl -B build-tests -G Ninja -DINV_CTL_BUILD_UI=OFF -DINV_CTL_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build build-tests --target inv_ctl_tests

      - name: ctest
        run: ctest --test-dir build-tests --output-on-failure

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write # needed to create releases from tags

    steps:
      - uses: actions/checkout@v7

      # Defense in depth: these gitignored files carry the WiFi PSK
      # (.zed/tasks.json env block, kas wifi fragments) or signing keys
      # (swu-keys/, any stray *.pem). Fail the build loudly if one ever
      # slips into a commit (git add -f, .gitignore regression) - the
      # repo is public.
      - name: Guard against committed secret files
        run: |
          LEAKED=$(git ls-files .zed swu-keys .kas-wifi-local.yml .kas-wifi-ci.yml '*.pem')
          if [ -n "$LEAKED" ]; then
            echo "::error::secret-bearing file(s) tracked by git: $LEAKED"
            exit 1
          fi

      # A Yocto build needs far more space than the default runner image.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL "$HOME/.rustup" || true
          sudo apt-get purge -y azure-cli microsoft-edge-stable \
                      google-cloud-cli ghc >/dev/null || true
          sudo apt-get autoremove -y >/dev/null
          df -h /

      - name: Install build host deps + kas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential chrpath cpio diffstat file gawk git \
            python3 python3-git python3-jinja2 python3-pyparsing \
            python3-setuptools zlib1g-dev
          python3 -m venv "$HOME/kas-venv"
          "$HOME/kas-venv/bin/pip" install --quiet kas
          echo "$HOME/kas-venv/bin" >> "$GITHUB_PATH"

      # OE wrynose sanity-checks that bitbake can create unprivileged user
      # namespaces (used for per-task network isolation). Ubuntu 24.04's
      # AppArmor blocks this by default; lift it for the runner.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true
          unshare --user --map-root-user true   # fail fast if still blocked

      # Reuse sstate between runs. Only build/sstate-cache is cached
      # (~1.3 GB): build/downloads is ~9.5 GB (8.4 GB of it is git2 bare
      # clones) and GitHub's per-repo cache quota is 10 GB, so caching it
      # put us at 9.97 GiB with zero headroom (saves silently fail above
      # the quota). Re-downloading costs minutes; losing sstate costs the
      # 2h+ recompile. restore-keys prefix fallback: when the key rotates
      # (kas/recipe changes), fall back to the newest yocto-* cache - sstate
      # is content-addressed, so bitbake rebuilds only what changed.
      - name: Restore bitbake cache
        uses: actions/cache/restore@v6
        with:
          path: build/sstate-cache
          key: yocto-${{ hashFiles('fw/**/*.yml', 'fw/**/*.bb', 'fw/conf/**') }}-${{ github.sha }}
          restore-keys: |
            yocto-${{ hashFiles('fw/**/*.yml', 'fw/**/*.bb', 'fw/conf/**') }}
            yocto-

      # WiFi from repo secrets (SOLAR_WIFI_SSID / SOLAR_WIFI_PSK /
      # SOLAR_WIFI_COUNTRY), layered in as a throwaway kas fragment so
      # nothing is committed. Secrets are auto-masked in runner logs.
      # WARNING: this repo is PUBLIC - artifacts and releases are
      # world-readable and a baked image contains the PSK. Only define
      # these secrets for a dedicated lab/guest SSID, or leave them unset
      # to keep building with the CHANGEME placeholders.
      - name: Configure WiFi from secrets
        env:
          SOLAR_WIFI_SSID: ${{ secrets.SOLAR_WIFI_SSID }}
          SOLAR_WIFI_PSK: ${{ secrets.SOLAR_WIFI_PSK }}
          SOLAR_WIFI_COUNTRY: ${{ secrets.SOLAR_WIFI_COUNTRY }}
        run: |
          if [ -z "$SOLAR_WIFI_SSID" ] || [ -z "$SOLAR_WIFI_PSK" ]; then
            echo "No WiFi secrets configured - building with CHANGEME placeholders."
            exit 0
          fi
          # These values go verbatim into bitbake conf lines (double-quoted)
          # and then into wpa_supplicant via sed. Reject anything that could
          # break conf parsing or sed instead of failing obscurely mid-build.
          # (A 64-hex PSK from wpa_passphrase always passes.)
          if printf '%s\n%s\n%s' "$SOLAR_WIFI_SSID" "$SOLAR_WIFI_PSK" "${SOLAR_WIFI_COUNTRY:-GB}" \
             | grep -vqE '^[A-Za-z0-9 ._:@^*+=/?!#%&()~-]*$'; then
            echo "::error::WiFi secrets contain unsupported characters (quotes, backslash, pipe, etc). Use a 64-hex PSK: wpa_passphrase SSID 'pass' | sed -n 's/.*psk=//p'"
            exit 1
          fi
          {
            echo "header:"
            echo "  version: 17"
            echo "local_conf_header:"
            echo "  wifi-ci: |"
            printf '    SOLAR_WIFI_SSID = "%s"\n' "$SOLAR_WIFI_SSID"
            printf '    SOLAR_WIFI_PSK = "%s"\n' "$SOLAR_WIFI_PSK"
            printf '    SOLAR_WIFI_COUNTRY = "%s"\n' "${SOLAR_WIFI_COUNTRY:-GB}"
          } > .kas-wifi-ci.yml
          echo "KAS_WIFI_FRAGMENT=.kas-wifi-ci.yml" >> "$GITHUB_ENV"
          echo "::notice::WiFi credentials are BAKED INTO THIS BUILD's image (PSK extractable)!"

      # .swu signing: ONLY the private key is a secret; the build derives
      # the public key from it (openssl rsa -pubout) and cross-checks
      # SOLAR_SWU_PUBLIC_KEY if ever set. There is no committed fallback
      # keypair anymore - a missing secret fails the build (this check gives
      # the readable error; forks cannot read secrets, so fork PRs are
      # expected to fail this step).
      - name: Require signing key secret
        env:
          SOLAR_SWU_PRIVATE_KEY: ${{ secrets.SOLAR_SWU_PRIVATE_KEY }}
        run: |
          if [ -z "$SOLAR_SWU_PRIVATE_KEY" ]; then
            echo "::error::Actions secret SOLAR_SWU_PRIVATE_KEY is not set. The repo deliberately ships NO fallback keys. Create a keypair with fw/tools/swu-keygen.sh, then: gh secret set SOLAR_SWU_PRIVATE_KEY < swu-keys/private.pem"
            exit 1
          fi

      - name: Build firmware image
        env:
          SOLAR_SWU_PRIVATE_KEY: ${{ secrets.SOLAR_SWU_PRIVATE_KEY }}
        run: kas build fw/kas-rpi0.yml${KAS_WIFI_FRAGMENT:+:$KAS_WIFI_FRAGMENT}

      # The image build parses+builds swupdate itself now, so no separate
      # gate job - but a green build does NOT prove our kconfig fragment
      # applied (olddefconfig silently drops symbols whose HAVE_<lib> probe
      # failed). The bbappend snapshots the merged .config into ${T}; rm_work
      # never deletes `temp`. Caveat (hit 2026-10-02, runs 36853440890/
      # 37002108982): on a WARM sstate cache do_configure is a setscene task,
      # no workdir/temp is ever created and the snapshot legitimately does
      # not exist - so if missing, force one cheap real do_configure; the
      # assert must not depend on cache temperature.
      - name: Verify swupdate merged kconfig
        run: |
          mapfile -t cfgs < <(find build/tmp/work -type f -name swupdate-merged-dotconfig | sort -u)
          if [ "${#cfgs[@]}" -eq 0 ]; then
            echo "no snapshot: swupdate was sstate-restored - forcing do_configure"
            kas shell -c "bitbake swupdate -c configure -f" \
              fw/kas-rpi0.yml${KAS_WIFI_FRAGMENT:+:$KAS_WIFI_FRAGMENT}
            mapfile -t cfgs < <(find build/tmp/work -type f -name swupdate-merged-dotconfig | sort -u)
            if [ "${#cfgs[@]}" -eq 0 ]; then
              echo "::error::still no swupdate-merged-dotconfig after forced do_configure"
              exit 1
            fi
          fi
          fail=0
          for cfg in "${cfgs[@]}"; do
            echo "--- $cfg"
            grep -E '^(CONFIG_[A-Z0-9_]+=|# CONFIG_[A-Z0-9_]+ is not set)' "$cfg" | grep -E \
              'UBOOT|BOOTLOADER|MTD|CFI|HASH|SIGN|SSL|CRYPTO|SYSTEMD|SURICATTA|CURL|WEBSERVER|MONGOOSE|DISKPART|LUA|RAW|SCRIPTS|DOWNLOAD' | sort
            grep -qx 'CONFIG_SIGNED_IMAGES=y' "$cfg" || { echo "::error::$cfg lost CONFIG_SIGNED_IMAGES"; fail=1; }
            grep -qx 'CONFIG_HASH_VERIFY=y' "$cfg" || { echo "::error::$cfg lost CONFIG_HASH_VERIFY"; fail=1; }
            grep -qx 'CONFIG_SIGALG_RAWRSA=y' "$cfg" || { echo "::error::$cfg lost CONFIG_SIGALG_RAWRSA (signing algo!)"; fail=1; }
            # U-Boot backend + explicit default-choice pin (the choice has no
            # default statement; see the fragment) and the URL download channel.
            grep -qx 'CONFIG_UBOOT=y' "$cfg" || { echo "::error::$cfg lost CONFIG_UBOOT (slot arm via bootenv!)"; fail=1; }
            grep -qx 'CONFIG_BOOTLOADER_DEFAULT_UBOOT=y' "$cfg" || { echo "::error::$cfg lost CONFIG_BOOTLOADER_DEFAULT_UBOOT (choice silently flipped?)"; fail=1; }
            grep -qx 'CONFIG_BOOTLOADERHANDLER=y' "$cfg" || { echo "::error::$cfg lost CONFIG_BOOTLOADERHANDLER (bootenv image handler missing - parser rejects the .swu!)"; fail=1; }
            grep -qx 'CONFIG_DOWNLOAD=y' "$cfg" || { echo "::error::$cfg lost CONFIG_DOWNLOAD (-u fetch)"; fail=1; }
            grep -qx 'CONFIG_DOWNLOAD_SSL=y' "$cfg" || { echo "::error::$cfg lost CONFIG_DOWNLOAD_SSL (https fetch)"; fail=1; }
            for off in CONFIG_MTD CONFIG_WEBSERVER CONFIG_LUA CONFIG_SCRIPTS CONFIG_SURICATTA; do
              grep -qx "${off}=y" "$cfg" && { echo "::error::$cfg has $off=y (fragment not applied?)"; fail=1; }
            done
          done
          exit $fail

      # Use the stable (symlinked) artifact names, resolve to real files.
      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp -L "$IMAGE_DIR/solar-ctl-image-raspberrypi0-wifi.rootfs.wic.bz2" \
                dist/solar-ctl-image.wic.bz2
          cp -L "$IMAGE_DIR/solar-ctl-image-raspberrypi0-wifi.rootfs.wic.bmap" \
                dist/solar-ctl-image.bmap
          cp -L "$IMAGE_DIR/solar-ctl-image-raspberrypi0-wifi.rootfs.manifest" \
                dist/solar-ctl-image.manifest
          # NB the stable .swu symlink keeps the ".rootfs" infix (IMAGE_LINK_NAME).
          cp -L "$IMAGE_DIR/solar-ctl-swu-raspberrypi0-wifi.rootfs.swu" \
                dist/solar-ctl-image.swu
          (cd dist && sha256sum solar-ctl-image.* > SHA256SUMS)
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: solar-ctl-image-${{ github.sha }}
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # -<sha> suffix: every run that saves writes a fresh entry (a fixed
      # key would be skipped with "cache already exists" whenever only
      # .c/.cfg files changed, leaving stale sstate behind). LRU eviction
      # keeps ~8 generations of ~1 GB entries under the 10 GB quota.
      # Same-repo PR runs save too (a long-lived PR that never saves pays
      # full cold-build cost on every iteration - measured 4 PR pushes in
      # a row restoring the same 5-day-old cache); fork PRs stay excluded
      # (they cannot read secrets and must not write shared cache).
      - name: Save bitbake cache
        uses: actions/cache/save@v6
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          path: build/sstate-cache
          key: yocto-${{ hashFiles('fw/**/*.yml', 'fw/**/*.bb', 'fw/conf/**') }}-${{ github.sha }}
